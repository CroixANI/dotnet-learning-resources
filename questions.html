<body id="page-top">

      <span class="site-title">.NET Learning</span>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    </div>
    <div id="navbarSupportedContent" class="nav-collapse">
      <ul id="main-navigation" class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>

      </div>
    </section>

  <div id="questions-groups-container" class="container-fluid"></div>

  <template id="question-template">
    <details>
      <summary class="question-title"></summary>
      <ul></ul>
    </details>
  </template>

  <template id="question-group-divider">
    <hr />

  <script src="js/questions-data.js"></script>

    window.questions.renderQuestionsGroups();
