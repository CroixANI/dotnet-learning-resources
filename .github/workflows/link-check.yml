name: Link Checker

on:
  schedule:
    - cron: '0 9 1 * *'  # 9am UTC on 1st of each month
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check links
        run: node scripts/check-links.mjs --no-semantic
